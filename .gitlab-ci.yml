include:
  - 'https://gitlab.esss.lu.se/ics-infrastructure/gitlab-ci-yml/raw/master/PreCommit.gitlab-ci.yml'
  - 'https://gitlab.esss.lu.se/ics-infrastructure/gitlab-ci-yml/raw/master/ArtifactoryPyPI.gitlab-ci.yml'

.runner_tags: &runner_tags
  tags:
    - docker

variables:
  PIP_INDEX_URL: "https://artifactory.esss.lu.se/artifactory/api/pypi/pypi-virtual/simple"

stages:
  - check
  - build
  - test
  - release

test-python27:
  <<: *runner_tags
  stage: test
  image: python:2.7
  before_script:
    - pip install -e .
  script:
    - run-iocsh -h

test-python36:
  <<: *runner_tags
  stage: test
  image: python:3.6
  before_script:
    - pip install -e .
  script:
    - run-iocsh -h

test-python37:
  <<: *runner_tags
  stage: test
  image: python:3.7
  before_script:
    - pip install -e .
  script:
    - run-iocsh -h
