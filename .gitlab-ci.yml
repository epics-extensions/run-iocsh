---
include:
  - project: "ics-infrastructure/gitlab-ci-yml"
    file: "PreCommit.gitlab-ci.yml"
  - project: "ics-infrastructure/gitlab-ci-yml"
    file: "ArtifactoryPyPI.gitlab-ci.yml"
  - project: "ics-infrastructure/gitlab-ci-yml"
    file: "SonarScanner.gitlab-ci.yml"

default:
  tags:
    - docker

variables:
  PIP_INDEX_URL: "https://artifactory.esss.lu.se/artifactory/api/pypi/pypi-virtual/simple"

stages:
  - check
  - build
  - test
  - analyse
  - release
  - deploy

build-pypi-package:
  image: python:3.12
  before_script:
    - pip install build
  script:
    - python -m build

.test:
  stage: test
  before_script:
    - pip install .[dev]
  script:
    - pytest -v tests

test-python312:
  extends: .test
  image: python:3.12
  script:
    - pytest -v --cov=run_iocsh --cov-report=term-missing --cov-report=xml tests
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    paths:
      - coverage.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

test-python313:
  extends: .test
  image: python:3.13

test-python314:
  extends: .test
  image: python:3.14

run-sonar-scanner:
  needs:
    - job: test-python312
      artifacts: true

pages:
  stage: deploy
  image: registry.esss.lu.se/ics-docker/sphinx
  script:
    - sphinx-build -M html docs docs/build
    - mv docs/build/html public
  artifacts:
    paths:
      - public
  only:
    - master
