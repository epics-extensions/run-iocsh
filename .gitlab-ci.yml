include:
  - 'https://gitlab.esss.lu.se/ics-infrastructure/gitlab-ci-yml/raw/master/PreCommit.gitlab-ci.yml'
  - 'https://gitlab.esss.lu.se/ics-infrastructure/gitlab-ci-yml/raw/master/ArtifactoryPyPI.gitlab-ci.yml'

.runner_tags: &runner_tags
  tags:
    - docker

variables:
  PIP_INDEX_URL: "https://artifactory.esss.lu.se/artifactory/api/pypi/pypi-virtual/simple"

stages:
  - check
  - build
  - test
  - release

test-python27:
  <<: *runner_tags
  stage: test
  image: registry.esss.lu.se/ics-docker/miniconda
  before_script:
    - source /etc/profile.d/conda.sh
    - conda create -n iocsh -y -c conda-test-virtual python=2.7 iocstats
    - conda activate iocsh
    - pip install pytest
    - pip install -e .
  script:
    - run-iocsh -h
    - pytest -v tests

test-python37:
  <<: *runner_tags
  stage: test
  image: registry.esss.lu.se/ics-docker/miniconda
  before_script:
    - source /etc/profile.d/conda.sh
    - conda create -n iocsh -y -c conda-test-virtual python=3.7 iocstats
    - conda activate iocsh
    - pip install pytest
    - pip install -e .
  script:
    - run-iocsh -h
    - pytest -v tests
