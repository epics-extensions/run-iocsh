---
include:
  - 'https://gitlab.esss.lu.se/ics-infrastructure/gitlab-ci-yml/raw/master/PreCommit.gitlab-ci.yml'
  - 'https://gitlab.esss.lu.se/ics-infrastructure/gitlab-ci-yml/raw/master/ArtifactoryPyPI.gitlab-ci.yml'

default:
  tags:
    - docker

variables:
  PIP_INDEX_URL: "https://artifactory.esss.lu.se/artifactory/api/pypi/pypi-virtual/simple"

stages:
  - check
  - build
  - test
  - release
  - deploy

run-pre-commit:
  script:
    - pre-commit run ruff --all-files
    - pre-commit run end-of-file-fixer --all-files
    - pre-commit run trailing-whitespace --all-files

run markdown lint:
  stage: check
  image: pipelinecomponents/markdownlint:latest
  script:
    - mdl --config .mdlrc .

build-pypi-package:
  image: python:3.6
  before_script:
    - pip install build
  script:
    - python -m build

.test-conda:
  stage: test
  image: registry.esss.lu.se/ics-docker/miniconda
  before_script:
    - source /etc/profile.d/conda.sh
    - conda create -n test -y -c conda-e3-virtual python=$PYTHON_VERSION require
    - conda activate test
    - pip install .[dev]
  script:
    - run-iocsh -h
    - pytest -v tests

test-conda-python36:
  extends: .test-conda
  script:
    - run-iocsh -h
    - coverage run -m pytest
    - coverage report
    - coverage xml
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  variables:
    PYTHON_VERSION: 3.6

test-conda-python37:
  extends: .test-conda
  variables:
    PYTHON_VERSION: 3.7

test-conda-python38:
  extends: .test-conda
  variables:
    PYTHON_VERSION: 3.8

test-conda-python39:
  extends: .test-conda
  variables:
    PYTHON_VERSION: 3.9

pages:
  stage: deploy
  image: registry.esss.lu.se/ics-docker/sphinx
  script:
    - sphinx-build -M html docs docs/build
    - mv docs/build/html public
  artifacts:
    paths:
      - public
  only:
    - master
