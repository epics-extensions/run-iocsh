[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=42",
  "wheel",
]

[project]
name = "run-iocsh"
version = "3.0.0"
description = "Wrapper to test IOCs"
readme = { file = "README.rst", content-type = "text/x-rst" }
keywords = [ "e3", "epics", "ess", "iocsh" ]
license = { text = "BSD-2 license" }
maintainers = [
  { name = "Anders Lindh Olsson", email = "anders.lindh.olsson@ess.eu" },
  { name = "Simon Rose", email = "simon.rose@ess.eu" },
  { name = "Lucas Magalhães", email = "lucas.magalhaes@ess.eu" },
  { name = "Douglas Araujo", email = "douglas.araujo@ess.eu" },
  { name = "Grzegorz Kowalski", email = "grzegorz.kowalski@ess.eu" },
  { name = "Luciano Carneiro Guedes", email = "luciano.carneiroguedes@ess.eu" },
  { name = "Andreas Persson", email = "andreas.persson@ess.eu" },
]
authors = [
  { name = "Benjamin Bertrand" },
  { name = "Anders Lindh Olsson", email = "anders.lindh.olsson@ess.eu" },
]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
optional-dependencies.dev = [
  "coverage",
  "pytest",
]
urls.Homepage = "https://gitlab.esss.lu.se/e3/run-iocsh"
scripts.run-iocsh = "run_iocsh.cli:main"

[tool.setuptools]
packages = [ "run_iocsh" ]

[tool.ruff]
target-version = "py311"
lint.select = [ "ALL" ]
lint.ignore = [
  "COM812",
  "D105",   # docstrings for magic methods
  "D107",   # docstrings for __init__ methods
  "D203",   # incompatibility between ruff lint and ruff format
  "D211",   # incompatible with D203
  "EM101",
  "EM102",  # exceptions may not use (f/) string literals
  "FIX",    # FIXMEs
  "G003",   # `logging` messages uses '+'
  "ISC001", # may cause conflicts when used with the formatter
  "S603",   # untrusted input to `subprocess`
  "TD",     # TODOs
  "TRY003", # long messages outside of the exception class
]
lint.per-file-ignores."examples/**" = [
  "ANN",     # type annotations -- example code reads closer to a user's
  "ARG",     # unused fixture arguments (pytest passes them for ordering)
  "D",       # docstyle
  "DTZ",     # timezone-naive datetime
  "INP001",  # packages missing __init__.py
  "PLR0913", # parametrized tests take many fixtures plus params
  "PLR2004", # magic values
  "S101",    # asserts
  "S607",    # partial executable path (the lewis simulator)
]
lint.per-file-ignores."run_iocsh/**" = [
  "D100", # "public" module missing docstring
]
lint.per-file-ignores."tests/**" = [
  "D",       # docstyle
  "INP001",  # packages missing __init__.py
  "PLR2004", # magic values
  "S101",    # asserts
  "SIM117",  # nested with-statements
]
lint.per-file-ignores."tests/scripts/**" = [
  "T201", # prints
]
lint.pydocstyle.convention = "google"

[tool.coverage]
run.source = [ "run_iocsh" ]

[tool.pymarkdown]
plugins.MD004.style = "consistent"
plugins.MD007.indent = 3
plugins.MD013.line_length = 120
plugins.MD013.code_blocks = false
plugins.MD014.enabled = false
plugins.MD024.allow_different_nesting = true
plugins.MD029.style = "ordered"
plugins.MD033.enabled = false
plugins.MD034.enabled = false
plugins.MD041.enabled = false
